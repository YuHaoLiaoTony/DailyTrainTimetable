name: Update train data

on:
  schedule:
    # 05:00 Asia/Taipei is 21:00 UTC on the previous day.
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: Number of days to generate (from today, Asia/Taipei)
        required: false
        default: "31"
        type: string

permissions:
  contents: write # 需要 write 才能推 keepalive commit
  pages: write
  id-token: write
  issues: write # 失敗回報需要建立／更新 workflow-failure issue

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 若有設定 KEEPALIVE_TOKEN（fine-grained PAT, contents:write）就用它，
          # 讓 keepalive commit 是「真人 push」而不只是 bot push。
          token: ${{ secrets.KEEPALIVE_TOKEN || github.token }}

      # GitHub 會在「repo 連續 60 天沒有 push」後自動停用 schedule 觸發。
      # 這個步驟每 intervalDays（預設 55 天）更新一次 .github/heartbeat.json 並 push，
      # 讓 60 天計時器永遠不會到期；其餘時間完全不產生 commit。
      - name: Refresh keepalive commit
        env:
          HEARTBEAT_FILE: .github/heartbeat.json
          DEFAULT_INTERVAL_DAYS: "55"
        run: |
          set -euo pipefail
          file="$HEARTBEAT_FILE"
          today="$(date -u +%F)"
          interval="$DEFAULT_INTERVAL_DAYS"
          last=""

          if [ -f "$file" ]; then
            last="$(sed -n 's/.*"lastRefreshedAt"[[:space:]]*:[[:space:]]*"\([0-9]\{4\}-[0-9][0-9]-[0-9][0-9]\)".*/\1/p' "$file" | head -n 1)"
            file_interval="$(sed -n 's/.*"intervalDays"[[:space:]]*:[[:space:]]*\([0-9][0-9]*\).*/\1/p' "$file" | head -n 1)"
            if [ -n "${file_interval:-}" ]; then
              interval="$file_interval"
            fi
          fi

          if [ -n "$last" ]; then
            due="$(date -u -d "$last + $interval days" +%F)"
            if [ "$(date -u -d "$today" +%s)" -lt "$(date -u -d "$due" +%s)" ]; then
              echo "keepalive 尚有效：last=$last interval=${interval}d nextDue=$due（今日 $today），跳過。"
              exit 0
            fi
          fi

          next="$(date -u -d "$today + $interval days" +%F)"
          mkdir -p "$(dirname "$file")"
          printf '{\n  "intervalDays": %s,\n  "lastRefreshedAt": "%s",\n  "nextDueAt": "%s"\n}\n' \
            "$interval" "$today" "$next" > "$file.tmp"
          mv "$file.tmp" "$file"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"

          if git diff --cached --quiet; then
            echo "keepalive 內容無變更，跳過 commit。"
            exit 0
          fi

          git commit -m "chore: refresh keepalive until $next"
          git push origin "HEAD:${GITHUB_REF_NAME}" \
            || { git pull --rebase --autostash && git push origin "HEAD:${GITHUB_REF_NAME}"; }
          echo "keepalive 已更新：last=$today nextDue=$next"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache output data
        uses: actions/cache@v4
        with:
          path: output/data
          key: train-data-${{ github.run_id }}
          restore-keys: |
            train-data-

      - name: Run tests
        run: dotnet test --configuration Release

      - name: Generate train timetable JSON
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: dotnet run --configuration Release --project DailyTrainTimetable.csproj -- --days ${{ inputs.days || '31' }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 測試／TDX 抓取／Pages 部署任一失敗都會走到這裡，留下可追蹤的 issue。
      # continue-on-error 讓回報步驟自身失敗時不會蓋掉原始錯誤（job 仍維持 failed）。
      - name: Report workflow failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LABEL: workflow-failure
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -uo pipefail

          marker="<!-- workflow-failure:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} -->"
          title="Update train data workflow 失敗（資料可能已停止更新）"
          body="$(printf '%s\n' \
            '### Update train data workflow 失敗' \
            '' \
            "- 執行紀錄：${RUN_URL}" \
            "- 觸發方式：\`${EVENT_NAME}\`" \
            "- 分支：\`${REF_NAME}\`" \
            "- 失敗時間（UTC）：\`$(date -u +%FT%TZ)\`" \
            '' \
            '排查方向：先看該 run 的第一個紅燈步驟。TDX 429／額度問題請看回應內容；`dotnet test` 失敗請在本機重跑；Pages 部署失敗通常是 Pages 來源設定或環境保護規則。' \
            '' \
            "${marker}")"

          # label 不存在時自動建立；--force 讓已存在時只更新描述。
          gh label create "$LABEL" --force \
            --color "D93F0B" \
            --description "Update train data workflow is failing (automated)" >/dev/null

          number="$(gh issue list \
            --label "$LABEL" \
            --state open \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "$number" ]; then
            if gh issue view "$number" --json comments --jq '.comments[].body' | grep -qF "$marker"; then
              echo "issue #$number 本次執行已回報過，略過重複留言。"
            else
              gh issue comment "$number" --body "$body"
              echo "已更新既有 issue #$number。"
            fi
          else
            gh issue create --title "$title" --label "$LABEL" --body "$body"
          fi

      # 成功時關閉殘留的失敗 issue，避免同一張單一直掛著。
      - name: Close workflow-failure issue after success
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LABEL: workflow-failure
        run: |
          set -uo pipefail
          number="$(gh issue list --label "$LABEL" --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            echo "沒有開啟中的 $LABEL issue。"
            exit 0
          fi
          gh issue comment "$number" --body "本次執行成功（${GITHUB_SERVER_URL}/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}），自動關閉。"
          gh issue close "$number" --reason completed
          echo "已關閉 issue #$number。"
